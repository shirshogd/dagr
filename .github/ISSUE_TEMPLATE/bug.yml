name: Bug
description: Something in the engine or setup steps does not work.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: dagr version or commit
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS and Python version
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command you ran
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Paste the full output.
    validations:
      required: true
